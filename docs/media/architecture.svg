<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="arch-title" width="1000" height="500" style="font-family: DM Sans, -apple-system, Segoe UI, sans-serif; background:#f3f7fd"><title id="arch-title">Camera frame to random projection to optic-lobe sensory neurons to the measured connectome, whose state carries between decisions, to motor neurons to frozen readouts for steering and speed, which move the car and produce the next frame.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1d24"></path></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"></path></marker><pattern id="pixels" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#2b2c34"></rect><rect width="5" height="5" fill="#4a4b55"></rect></pattern></defs><g><text x="94" y="118" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb" text-anchor="middle">INPUT</text><rect x="30" y="130" width="128" height="64" rx="6" fill="url(#pixels)" stroke="#e4e4ea"></rect><rect x="30" y="162" width="128" height="32" fill="#9a9ba6" opacity="0.55"></rect><path d="M 70 194 L 94 162 L 100 162 L 118 194 Z" fill="#c9cad3" opacity="0.8"></path><text x="94" y="214" font-size="12" font-weight="600" fill="#1c1d24" text-anchor="middle">Camera frame</text><text x="94" y="229" font-size="11" fill="#6b6e78" text-anchor="middle">64 × 32 grey · every 50 ms</text></g><path d="M 160 162 L 194 162" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><g><rect x="198" y="128" width="132" height="70" rx="14" fill="white" stroke="#e4e4ea" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="212" y="147" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb">ENGINEERED · FROZEN</text><text x="212" y="168" font-size="13.5" font-weight="600" fill="#1c1d24">Random pixel map</text><text x="212" y="186" font-size="11" fill="#6b6e78">one pixel, one sign</text><text x="212" y="200" font-size="11" fill="#6b6e78">per sensory neuron</text></g><path d="M 332 162 L 366 162" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><rect x="370" y="56" width="340" height="330" rx="22" fill="#e6eefc" stroke="#2563eb" stroke-width="1.4"></rect><text x="388" y="82" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb">MEASURED · MALECNS CONNECTOME</text><text x="388" y="104" font-size="15" font-weight="600" fill="#1c1d24">165,122 neurons · 25,563,197 synapses</text><text x="388" y="121" font-size="11" fill="#6b6e78">which neuron talks to which is fixed by the microscope</text><g><rect x="388" y="132" width="112" height="62" rx="14" fill="white" stroke="#e4e4ea" stroke-width="1.2"></rect><text x="402" y="160" font-size="13.5" font-weight="600" fill="#1c1d24">Optic lobe</text><text x="402" y="178" font-size="11" fill="#6b6e78">4,114 sensory</text><text x="402" y="192" font-size="11" fill="#6b6e78">neurons</text></g><g><rect x="580" y="132" width="112" height="62" rx="14" fill="white" stroke="#e4e4ea" stroke-width="1.2"></rect><text x="594" y="160" font-size="13.5" font-weight="600" fill="#1c1d24">Ventral cord</text><text x="594" y="178" font-size="11" fill="#6b6e78">708 motor</text><text x="594" y="192" font-size="11" fill="#6b6e78">neurons</text></g><path d="M 502 162 L 576 162" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><ellipse cx="540" cy="290" rx="130" ry="54" fill="white" stroke="#2563eb" stroke-width="1.2"></ellipse><text x="540" y="268" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb" text-anchor="middle">LEARNED</text><text x="540" y="289" font-size="13" font-weight="600" fill="#1c1d24" text-anchor="middle">one gain per synapse · one leak per neuron</text><text x="540" y="306" font-size="11" fill="#6b6e78" text-anchor="middle">signed rate state · 4 updates per decision</text><text x="540" y="322" font-size="11" fill="#6b6e78" text-anchor="middle">25,728,319 trainable parameters</text><path d="M 444 196 L 444 224 C 444 240, 470 250, 480 254" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><path d="M 636 196 L 636 224 C 636 240, 610 250, 600 254" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><path d="M 420 318 C 380 330, 380 260, 414 262" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"></path><text x="393" y="358" font-size="11" fill="#2563eb">state carried to the next decision</text><text x="540" y="376" font-size="11" fill="#6b6e78" text-anchor="middle">the only path from pixels to the wheel</text><path d="M 712 162 L 746 162" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><g><rect x="750" y="100" width="150" height="62" rx="14" fill="white" stroke="#e4e4ea" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="764" y="119" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb">ENGINEERED · FROZEN</text><text x="764" y="140" font-size="13.5" font-weight="600" fill="#1c1d24">Steering readout</text><text x="764" y="158" font-size="11" fill="#6b6e78">fixed weights · tanh</text></g><g><rect x="750" y="172" width="150" height="62" rx="14" fill="white" stroke="#e4e4ea" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="764" y="191" font-size="9" font-weight="600" letter-spacing="1.3" fill="#2563eb">ENGINEERED · FROZEN</text><text x="764" y="212" font-size="13.5" font-weight="600" fill="#1c1d24">Speed readout</text><text x="764" y="230" font-size="11" fill="#6b6e78">fixed weights · sigmoid</text></g><text x="825" y="254" font-size="10.5" fill="#6b6e78" text-anchor="middle">speed only in the crossers task</text><rect x="795" y="300" width="60" height="30" rx="8" fill="#f3f7fd" stroke="#e4e4ea"></rect><text x="825" y="319" font-size="11" font-weight="600" fill="#1c1d24" text-anchor="middle">car</text><text x="825" y="346" font-size="10.5" fill="#6b6e78" text-anchor="middle">8 m/s bicycle model</text><path d="M 900 131 L 930 131 L 930 315 L 859 315" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><path d="M 825 332 L 825 440 L 94 440 L 94 240" fill="none" stroke="#1c1d24" stroke-width="1.4" marker-end="url(#arrow)"></path><text x="460" y="458" font-size="11" fill="#6b6e78" text-anchor="middle">the car moves, the next frame is rendered</text></svg>